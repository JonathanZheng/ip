plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('config/checkstyle/checkstyle.xml')
}

// JaCoCo 0.8.14 supports the Java 25 bytecode used by this project.
jacoco {
    toolVersion = '0.8.14'
}

// Exclude only the JavaFX window, message widgets, and their launcher.
def nonGuiClasses = sourceSets.main.output.asFileTree.matching {
    exclude 'duke/SevenSixGui*', 'duke/DialogBox*', 'duke/Launcher*'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    classDirectories.setFrom(nonGuiClasses)
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(nonGuiClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.99
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.97
            }
        }
    }
}

check {
    dependsOn jacocoTestReport, jacocoTestCoverageVerification
}

// Exercise the entire suite in a fresh JVM whose default language is Chinese.
tasks.register('testChineseLocale', Test) {
    description = 'Runs all JUnit tests with the zh-CN JVM locale.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'user.language', 'zh'
    systemProperty 'user.country', 'CN'
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25.0.3'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'duke.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'duke.jar'
}

run {
    standardInput = System.in
    // Assertions are off by default in the JVM, so enable them when running from Gradle.
    // The 'test' task already enables them by default, so JUnit runs check them too.
    enableAssertions = true
}
